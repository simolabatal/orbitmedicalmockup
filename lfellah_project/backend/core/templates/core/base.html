{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}L'Fellah{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/tailwind.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/custom-ui.css' %}">
    <style>
        /* ── Logo standard ───────────────────────────────────────── */
        .site-logo {
            height: 5rem;
            object-fit: contain;
            max-width: 100%;
            transition: transform 0.2s ease;
        }
        .site-logo:hover {
            transform: scale(1.05);
        }
        /* Variante compacte (mobile / sidebar) */
        .site-logo-sm {
            height: 3.5rem;
            object-fit: contain;
            max-width: 100%;
            transition: transform 0.2s ease;
        }
        .site-logo-sm:hover {
            transform: scale(1.05);
        }
        /* Variante header sticky — centre, propre, sans filtre */
        .site-logo-header {
            height: 5.5rem;
            object-fit: contain;
            max-width: 100%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .site-logo-header:hover {
            transform: scale(1.04);
        }
        /* Smooth scroll */
        html { scroll-behavior: smooth; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased min-h-screen">

    <!-- ══════════════════════════════════════════════════════════ -->
    <!-- ▓▓▓  HEADER GLOBAL — identique sur toutes les pages  ▓▓▓ -->
    <!-- ══════════════════════════════════════════════════════════ -->
    {% block global_header %}
    <header class="sticky top-0 z-50 glass-header" style="min-height:7rem">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between py-2">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2.5 no-underline flex-shrink-0" aria-label="L'Fellah — Accueil">
                <img src="{{ MEDIA_URL }}logo.png" alt="L'Fellah — Smart Agriculture" class="site-logo-header">
            </a>
            <div class="flex items-center gap-2 sm:gap-3">
                {% block header_right %}{% endblock %}
            </div>
        </div>
    </header>
    {% endblock %}

    <!-- ══════════════════════════════════════════════════════════ -->
    <!-- ▓▓▓  CONTENU PRINCIPAL  ▓▓▓ -->
    <!-- ══════════════════════════════════════════════════════════ -->
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
